  <text x="380" y="244" font-size="13.5" fill="#96281b"  text-anchor="middle">녹음은 대화 당사자가 하면 적법성 문제가 적다</text>
  <text x="380" y="270" font-size="12.5" fill="#666"  text-anchor="middle">캡처만 남기고 원본을 지우지 말 것</text>
