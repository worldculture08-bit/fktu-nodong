<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><rect width="760" height="300" fill="#ffffff"/>
  <text x="380" y="34" font-size="18" fill="#222" font-weight="bold" text-anchor="middle">증거 노트 — 5단계로 만들기</text>
  
    <rect x="48" y="70" width="128" height="120" rx="10" fill="#fff5f5" stroke="#c0392b" stroke-width="1.6"/>
