    <text x="396" y="140" font-size="13" fill="#96281b" font-weight="bold" text-anchor="middle">원본 보관</text>
    <text x="396" y="162" font-size="10.5" fill="#666"  text-anchor="middle">채팅·메일은 원본과</text><text x="396" y="180" font-size="10.5" fill="#666"  text-anchor="middle">캡처 함께</text>
    <rect x="474" y="70" width="128" height="120" rx="10" fill="#fff5f5" stroke="#c0392b" stroke-width="1.6"/>
    <circle cx="538" cy="100" r="18" fill="#c0392b"/>
    <text x="538" y="106" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle">4</text>
    <text x="538" y="140" font-size="13" fill="#96281b" font-weight="bold" text-anchor="middle">월별 대조</text>
    <text x="538" y="162" font-size="10.5" fill="#666"  text-anchor="middle">통장 기록과</text><text x="538" y="180" font-size="10.5" fill="#666"  text-anchor="middle">임금명세서 대조</text>
    <rect x="616" y="70" width="128" height="120" rx="10" fill="#fff5f5" stroke="#c0392b" stroke-width="1.6"/>
    <circle cx="680" cy="100" r="18" fill="#c0392b"/>
