    <text x="254" y="162" font-size="10.5" fill="#666"  text-anchor="middle">일어난 일을</text><text x="254" y="180" font-size="10.5" fill="#666"  text-anchor="middle">5W1H로 적기</text>
    <rect x="332" y="70" width="128" height="120" rx="10" fill="#fff5f5" stroke="#c0392b" stroke-width="1.6"/>
