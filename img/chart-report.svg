<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><rect width="760" height="300" fill="#ffffff"/>
  <text x="380" y="34" font-size="18" fill="#222" font-weight="bold" text-anchor="middle">직장 괴롭힘 — 신고 절차</text>
  
    <rect x="70" y="70" width="180" height="90" rx="10" fill="#fff5f5" stroke="#c0392b" stroke-width="2"/>
    <text x="160" y="100" font-size="15.5" fill="#96281b" font-weight="bold" text-anchor="middle">기록</text>
    <text x="160" y="126" font-size="12" fill="#222"  text-anchor="middle">일시·장소·내용·목격자</text>
  
    <rect x="290" y="70" width="180" height="90" rx="10" fill="#fff5f5" stroke="#c0392b" stroke-width="2"/>
    <text x="380" y="100" font-size="15.5" fill="#96281b" font-weight="bold" text-anchor="middle">회사 신고</text>
    <text x="380" y="126" font-size="12" fill="#222"  text-anchor="middle">사내 신고 채널 이용</text>
  
    <rect x="510" y="70" width="180" height="90" rx="10" fill="#fff5f5" stroke="#c0392b" stroke-width="2"/>
    <text x="600" y="100" font-size="15.5" fill="#96281b" font-weight="bold" text-anchor="middle">외부 신고</text>
    <text x="600" y="126" font-size="12" fill="#222"  text-anchor="middle">고용노동부 신고·상담</text>
  
  <path d="M250 115 L290 115" stroke="#c0392b" stroke-width="2" marker-end="url(#a3)"/>
  <path d="M470 115 L510 115" stroke="#c0392b" stroke-width="2" marker-end="url(#a3)"/>
  <rect x="120" y="200" width="520" height="64" rx="8" fill="#fff" stroke="#e5e5e5"/>
  <text x="380" y="228" font-size="14" fill="#96281b" font-weight="bold" text-anchor="middle">신고했다는 이유로 불이익을 주면 별도의 위법행위가 된다</text>
  <text x="380" y="250" font-size="12.5" fill="#666"  text-anchor="middle">신고 기록은 날짜까지 남긴다</text>
  <defs><marker id="a3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#c0392b" stroke-width="1.5"/></marker></defs>
</svg>