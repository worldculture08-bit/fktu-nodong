<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><rect width="760" height="300" fill="#ffffff"/>
  <text x="380" y="34" font-size="18" fill="#222" font-weight="bold" text-anchor="middle">기간제·단시간 — 오해 vs 실제</text>
  <rect x="70" y="64" width="300" height="30" fill="#999"/>
  <rect x="390" y="64" width="300" height="30" fill="#c0392b"/>
  <text x="220" y="85" font-size="14.5" fill="#fff" font-weight="bold" text-anchor="middle">오해</text>
  <text x="540" y="85" font-size="14.5" fill="#fff" font-weight="bold" text-anchor="middle">실제</text>
  
    <text x="85" y="118" font-size="12.5" fill="#666"  text-anchor="start">계약직은 해고예고가 필요 없다</text>
    <text x="405" y="118" font-size="12.5" fill="#96281b" font-weight="bold" text-anchor="start">계약직도 해고 절차가 필요하다</text>
    <line x1="70" y1="134" x2="690" y2="134" stroke="#e5e5e5"/>
    <text x="85" y="162" font-size="12.5" fill="#666"  text-anchor="start">단시간 근로자는 연차가 없다</text>
    <text x="405" y="162" font-size="12.5" fill="#96281b" font-weight="bold" text-anchor="start">근로시간 비율로 연차가 생긴다</text>
    <line x1="70" y1="178" x2="690" y2="178" stroke="#e5e5e5"/>
    <text x="85" y="206" font-size="12.5" fill="#666"  text-anchor="start">수당은 정규직만 받는다</text>
    <text x="405" y="206" font-size="12.5" fill="#96281b" font-weight="bold" text-anchor="start">연장·야간·휴일근로 시 똑같이 발생</text>
    <line x1="70" y1="222" x2="690" y2="222" stroke="#e5e5e5"/>
    <text x="85" y="250" font-size="12.5" fill="#666"  text-anchor="start">기간 끝나면 알아서 끝난다</text>
    <text x="405" y="250" font-size="12.5" fill="#96281b" font-weight="bold" text-anchor="start">계속 근로 시 갱신 요구 권리가 있다</text>
    <line x1="70" y1="266" x2="690" y2="266" stroke="#e5e5e5"/>
  <text x="380" y="288" font-size="13" fill="#96281b"  text-anchor="middle">같거나 유사한 업무라면 차별적 처우는 법 위반 — 노동위에 시정 신청 가능</text>
</svg>