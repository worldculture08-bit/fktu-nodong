<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><rect width="760" height="320" fill="#ffffff"/>
  <text x="380" y="34" font-size="18" fill="#222" font-weight="bold" text-anchor="middle">해고 — 법이 요구하는 절차</text>
  
    <rect x="60" y="66" width="200" height="86" rx="10" fill="#fff" stroke="#2c5f8a" stroke-width="2"/>
    <text x="160" y="96" font-size="15" fill="#2c5f8a" font-weight="bold" text-anchor="middle">해고 사유</text>
    <text x="160" y="124" font-size="12" fill="#666"  text-anchor="middle">정리해고는 4요건 별도 충족</text>
  
    <rect x="310" y="66" width="200" height="86" rx="10" fill="#fff" stroke="#2c5f8a" stroke-width="2"/>
    <text x="410" y="96" font-size="15" fill="#2c5f8a" font-weight="bold" text-anchor="middle">30일 전 예고</text>
    <text x="410" y="124" font-size="12" fill="#666"  text-anchor="middle">또는 예고수당 30일분</text>
  
    <rect x="560" y="66" width="200" height="86" rx="10" fill="#fff" stroke="#2c5f8a" stroke-width="2"/>
    <text x="660" y="96" font-size="15" fill="#2c5f8a" font-weight="bold" text-anchor="middle">서면 통지</text>
    <text x="660" y="124" font-size="12" fill="#666"  text-anchor="middle">구두 해고는 무효 가능</text>
  
  <path d="M260 109 L310 109" stroke="#2c5f8a" stroke-width="2" marker-end="url(#a2)"/>
  <path d="M510 109 L560 109" stroke="#2c5f8a" stroke-width="2" marker-end="url(#a2)"/>
  <rect x="90" y="190" width="620" height="86" rx="10" fill="#fff5f5" stroke="#c0392b" stroke-width="2"/>
  <text x="400" y="222" font-size="15" fill="#96281b" font-weight="bold" text-anchor="middle">절차 위반 해고라면 — 노동위원회 구제신청</text>
  <text x="400" y="250" font-size="12.5" fill="#666"  text-anchor="middle">부당해고 구제신청은 해고일부터 3개월 안에</text>
  <defs><marker id="a2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#2c5f8a" stroke-width="1.5"/></marker></defs>
  <text x="400" y="308" font-size="13" fill="#666"  text-anchor="middle">해고는 "이유 + 절차" 둘 다 있어야만 법적으로 유효하다</text>
</svg>